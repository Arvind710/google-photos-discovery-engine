# Stated limitations — measured metrics that stayed below threshold after their
# remediation loop (implementationplan.md §0.3: "reported as a stated limitation
# in the app and the deck and the phase passes carrying it. Never silently
# dropped"). A gate test accepts a below-threshold metric ONLY through an entry
# here whose `measured` matches the committed artifact.
#
# Absolute thresholds (T-1, T-2, T-14, T-15, T-16, T-18) can never appear here.

P2-MET-1:
  threshold: "T-5 ≥ 0.80 — story-count agreement, gpt-5-mini vs gpt-5"
  measured: 0.35
  artifact: data/artifacts/segment_dual_segment-dual-20260926-092027-c4ea26.json
  sample: 60 story-bearing records, equal per source (a mixed sample read 0.80, but 3 in 4 of its records hold no story)
  iterations: 3
  direction: >
    One-sided. gpt-5 found fewer stories in 39 of 60 records and more in none; the
    disputed candidates were general deletion, device and export problems.
  mitigation: >
    gpt-5 now confirms every candidate gpt-5-mini finds (pipeline/segment/confirm.py,
    Docs/decisions.md D-8). The stored stories are gpt-5-confirmed; gpt-5-mini alone
    is not trusted to count stories.
  disclosed_in: [Docs/decisions.md D-8, Data Bank Part 5 note, Methodology (P6)]

P2-MET-2:
  threshold: "T-6 ≥ 0.75 — reaches_stage agreement on the gating band (<5 · 5–6 · ≥7)"
  measured: 0.55
  artifact: data/artifacts/segment_dual_segment-dual-20260926-092027-c4ea26.json
  sample: 20 matched stories
  iterations: 3
  mitigation: >
    Every stored story's reaches_stage is the HIGHER of gpt-5-mini's and gpt-5's
    (confirmation pass), so disagreement resolves upward across the whole corpus,
    not only the sample (EC-SEG-5). Block yield (P3-MET-9) is the downstream check.
  disclosed_in: [Docs/decisions.md D-8, Methodology (P6)]

P2-MET-4:
  threshold: "zero-story rate among records Pass 1 read ≤ 0.25"
  measured: 0.973
  counts: "11,475 of 11,794 records read hold no confirmed story (1,340 of them emptied by gpt-5 confirmation)"
  iterations: 0
  why_fewer: >
    The rate flags a gate that is too broad, which costs money, not correctness.
    Narrowing it failed the recall probe in round 1 (T-4 6.5%, D-5), and T-4 is
    never cut. Pass 1 cost less than its estimate on every batch, so there was no
    cost to recover.
  mitigation: >
    Reported as a finding. Most public text that mentions finding a photo is about
    lost, deleted or unsynced photos, not about searching from vague memory.
  disclosed_in: [Docs/decisions.md D-8, Data Bank Part 3 and Part 5]

T-20:
  threshold: "≥ 300 core stories ([CTX] §14.3) — a P3 gate, recorded here when it was known"
  measured: 115
  counts: "115 core stories from 109 people; 219 adjacent; 31,235 records collected"
  iterations: 2
  why_fewer: >
    The loop-back is collection only, and paid collection is exhausted: the Apify
    cycle is spent ($9.52 of $10) until 2026-10-18, after submission. The free
    sources were topped up once already. The PM chose to proceed on 115.
  loop_backs: >
    Two P1-F top-ups (implementationplan.md §0.4): YouTube, Stack Exchange, Hacker
    News (free), then X (Apify, $1.58). The Apify budget for the cycle is spent
    ($9.52 of $10).
  mitigation: >
    The PM chose to proceed (2026-09-26). Every share goes through share(), so thin
    cells show counts only. Headline claims stay at one dimension. The Part 3
    interviews carry more of the weight.
  disclosed_in: [Docs/decisions.md D-8, Data Bank Part 5 verdict, deck]

# P3-MET-9 (T-7, block yield ≥ 25%), 2026-09-26. Measured over every
# (story, question) row a block produced, after the Stage 0 re-code.
P3-MET-9-B:
  threshold: "T-7 ≥ 0.25 — non-not_stated share where Block B ran"
  measured: 0.202
  iterations: 0
  why_fewer: >
    T-7's remediation is the reaches_stage gate (EC-SEG-5/6), and Block B is not
    gated: it is asked of every core story. There is no gate to move. On the
    questions the coverage register keeps as `coded`, Block B yields 0.348.
  mitigation: >
    Low-yield B questions (0.2, 1.4, 2.5, 2.8, 3.4, 4.3) are routed to the
    interview register by coverage, not dropped; every share is over the
    stories that answered, with the count beside it.
  disclosed_in: [Docs/decisions.md D-9, Data Bank Part 6, Methodology (P6)]

P3-MET-9-C:
  threshold: "T-7 ≥ 0.25 — non-not_stated share where Block C ran"
  measured: 0.147
  iterations: 0
  why_fewer: >
    The gate is not what is wrong. Where the gate would NOT have run C
    (reaches_stage < 5, core stories coded in full), C yields 0.000 — nothing is
    lost below the gate (the EC-SEG-5 check). Inside the gate it yields 0.152:
    public posts rarely describe what search did or how results looked. Moving
    the gate up would cut cost, not raise what the text says (EC-SEG-6, the
    cheap direction), and risks the expensive one.
  mitigation: >
    Stage 5 and 6 questions below 15% coverage go to the interview register
    (5.2, 5.3, 5.4, 5.5, 6.3, 6.4, 6.7 among them), where observed search tasks
    can answer them.
  disclosed_in: [Docs/decisions.md D-9, Data Bank Part 6, Methodology (P6)]

P3-MET-9-D:
  threshold: "T-7 ≥ 0.25 — non-not_stated share where Block D ran"
  measured: 0.212
  iterations: 0
  why_fewer: >
    As for C: below the gate (reaches_stage < 7) D yields 0.063, inside it
    0.228. The shortfall is how little public posts say about adaptation and
    aftermath, not the gate.
  mitigation: >
    9.2, 9.3, 9.6, 10.1 and 10.2 go to the interview register; the rest are
    reported with coverage beside every share.
  disclosed_in: [Docs/decisions.md D-9, Data Bank Part 6, Methodology (P6)]
