[pytest]
testpaths = evals
markers =
    p0: P0 gate -- foundation, schema, codebook freeze, harness, ops
    p1: P1 gate -- collection, cleaning, Data Bank
    p2: P2 gate -- segmentation
    p3: P3 gate -- coding and reliability
    p4: P4 gate -- analysis and opportunities
    p5: P5 gate -- Ask AI and Try it
    p6: P6 gate -- release
    needs_corpus: requires a populated data/corpus.db
    needs_api: makes a live, paid API call -- never run in CI
    manual: verifies a step only the PM can perform; excluded from CI, included in gate reports
addopts = -q --strict-markers
