# scoring_v1.yaml — [CTX] §15.2, exactly. PRE-REGISTERED.
#
# `pre_registered_at` is set before any ranking run exists, and a ranking run
# dated before it is a hard error (P4-INV-4, EC-ANL-6). Tuning weights after
# seeing a ranking makes the sensitivity check theatre. The UI lets the PM move
# the weights ([CTX] §9.2); the headline ranking always uses THESE, and shows
# this timestamp.

version: v1
pre_registered_at: "2026-09-26T00:34:41+05:30"

scale: {min: 1, max: 5}   # every criterion scored 1–5 with a one-line justification

gates:                     # pass/fail, not weighted
  addressable_by_gp: {min: 3}   # GP cannot fix it → not an opportunity
  ai_necessity:      {min: 3}   # a UI tweak would do → fails the brief's "where intelligence is needed"

weights:                   # sum to 100
  metric_leverage: 30
  severity: 25
  frequency: 20
  evidence_strength: 15
  reach: 10                # estimated share of the GP user base affected (PM judgement), not story count

sensitivity:
  draws: 1000
  perturbation_abs: 10     # each weight moved uniformly within ±10, then renormalised
  robust_at: 0.80          # top stays top in ≥80% of draws
  co_leaders_below: 0.60   # below this, present the top two as co-leaders

# Gated-out candidates are shown, greyed, with the failing gate named (EC-ANL-2).
