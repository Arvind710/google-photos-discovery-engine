        metric_node: refines_instead_of_quitting
        values: [one_attempt, few_attempts_minutes, many_attempts_under_hour, hour_or_more,
                 not_stated, other]
        value_notes:
          _source: >
            [SOL-JOURNEY] says "record query count, mode switches and total time";
            the four bands are that instruction made codeable. Register by default:
            [CTX] §3.3 names this as the example public data cannot answer.
      - id: "8.2"
        block: D
        select: multi
        text: What decides continue vs quit?
