# lexicon_v1.yaml — [CTX] §6.2 seed lexicon. NOT frozen: the lexicon is meant to
# EXPAND from vocabulary found in relevant posts, and P1-MET-3 (the recall probe)
# adds terms whenever >5% of rejected records turn out relevant (T-4).
#
# `hits` is filled per term by the collectors — the final lexicon with hit
# counts is a required reproducibility output ([CTX] §6.2). Every record stores
# the `collect_query` that surfaced it, so collection bias stays auditable.
# Terms added after the seed carry `added_by` and `added_at`.

