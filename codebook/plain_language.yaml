# plain_language.yaml — how the app says things to someone who has never read
# the codebook. `app/lib` is the only reader; no view hardcodes a label.
# Rules carried over from the Myntra design language (§9): the plain name leads,
# the code follows in small type; every metric explains itself; say what a
# number is NOT before saying what it is.
#
# Question-level `plain` and `voice` live on each question in journey_v1.yaml,
# so they cannot drift from the codebook. This file holds everything above the
# question level. Not frozen — display copy, not coding input.

stages:
  # `short` is the chart label; plain words, never the codebook's own terms (2026-09-27).
  "0":  {title: "Is the photo there to find?",        short: "Was the photo there?"}
  "1":  {title: "Why they went looking",              short: "Why they looked"}
  "2":  {title: "What they remember",                 short: "What they remember"}
  "3":  {title: "Where and how they look",            short: "Where they looked"}
  "4":  {title: "Putting the memory into words",      short: "Putting it into words"}
  "5":  {title: "Does search understand it?",         short: "Did search understand?"}
  "6":  {title: "Spotting it in the results",         short: "Spotting it in results"}
  "7":  {title: "Working out what went wrong",        short: "Trying another way"}
  "8":  {title: "Keep going or give up",              short: "Keep going or give up"}
  "9":  {title: "How it ended",                       short: "How it ended"}
  "10": {title: "What changed afterwards",            short: "Afterwards"}

failure_owners:
  library_data: The photo was never there, or its data was wrong
  memory: They couldn't remember enough
  strategy: They looked in the wrong place, or never searched
  expression: They remembered it but couldn't put it into words
  system: Search didn't understand or match what they gave it
  presentation: It was in the results but hard to recognise
  recovery: After a miss, they couldn't find a better way in
  persistence: They gave up
  none: Not a failure point

inferred_label: "inferred from user evidence"

proxy_warning: >
  Every share here is a share of coded public stories — never a retrieval
  success rate, never a share of users, never a share of searches. People post
  when things go wrong, so quiet successes and people who never search are
  under-counted by construction.

metrics:
  share: >
    Out of the cases in the group named, the fraction with this property. It is
    not a failure rate and not a share of Google Photos users. Below 30 cases we
    show only the count; from 30 to 79 the share is marked as only a rough guide.
  n_authors: >
    How many different people. 200 cases from 14 people is weaker evidence than
    200 from 180, so both counts always appear together.
  coverage: >
    How often the posts say anything at all about this question. When few do, it
    says nothing about users — it means the question needs an interview, and it
    goes to the interview guide.
  kappa: >
    The agreement score is how often two AI readers gave the same answer, after
    allowing for agreement by chance: 1 is perfect agreement, 0 is no better than
    chance. It shows the reading was consistent, not that it was right — two
    readers can agree and both be wrong.

# P1 — the Data Bank. Plain names for sources and for how each was collected
# (Docs/decisions.md D-1). The method line is a disclosure, so it says plainly
# where a platform's robots.txt was not followed.
sources:
  reddit:        {label: Reddit, kind: "community threads"}
  gp_help:       {label: Google Photos Help Community, kind: "support-forum threads"}
  play:          {label: Google Play reviews, kind: "app reviews"}
  appstore:      {label: App Store reviews, kind: "app reviews"}
  youtube:       {label: YouTube comments, kind: "comment threads under videos"}
  stackexchange: {label: Stack Exchange, kind: "questions and answers"}
  hackernews:    {label: Hacker News, kind: "comments and posts"}
  x:             {label: X (Twitter), kind: "posts"}
  quora:         {label: Quora, kind: "answers"}

collect_methods:
  official_api: >
    The platform's own official way for programs to read public posts, used as
    the platform documents it.
  public_feed: >
    A public feed the platform publishes for anyone to read.
  public_scraper_lib: >
    A free, open tool that reads the public app-store listing.
  headless_render: >
    Public thread pages opened by an automated browser. The site's published
    rules for automated visitors allow the pages themselves, but not the address
    each page uses to load its posts.
  apify: >
    A paid collection service (Apify). The site's published rules for automated
    visitors forbid all automated collection, and its official access was not
    available to this project; collected anyway, by decision, and disclosed here.

exclusion_reasons:
  deleted: Deleted or removed before it was read
  too_short: Too short to say anything (under 20 letters)
  low_quality: Nothing in it the study could use
  exact_duplicate: The same words as an earlier record
  near_duplicate_same_author: A near-repeat by the same person
  lexicon_rejected: Never mentions a photo, picture or screenshot
  out_of_window: Posted outside the dates collected
  no_story: About photos, but no attempt to find one
  span_unverified: The passage quoted as evidence was not found word for word in the post
  coding_failed: The AI reader's answer could not be read
  model_refusal: The AI reader declined to read it
